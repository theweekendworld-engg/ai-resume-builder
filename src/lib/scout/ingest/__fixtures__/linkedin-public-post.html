At Park+, we're not just looking for backend developers—we're looking for great engineers.

With AI transforming software development, we believe the future belongs to engineers who combine strong computer science fundamentals with the ability to leverage AI to solve complex problems faster and better.

If you have 2.5–4 years of full-time software engineering experience, enjoy building scalable backend systems, and thrive in a fast-paced product environment, we'd love to connect.

What we're looking for:
✅ Strong Data Structures &amp; Algorithms fundamentals
✅ Experience building scalable backend systems &amp; REST APIs
✅ Solid understanding of distributed systems, databases, networking, caching &amp; concurrency
✅ Hands-on experience with AI coding tools like Cursor, GitHub Copilot, Claude Code, ChatGPT, Windsurf, or Gemini
✅ B.Tech/B.E. in Computer Science, Information Technology, or a related engineering discipline is mandatory

Why Park+?
🚗 Build products used by millions of users across India
🤖 Work in an AI-first engineering culture
🚀 High ownership, rapid learning, and real impact from Day 1

📍 Location: Gurugram (Work From Office)

📩 Ready to build the future with us?
Apply here: https://lnkd.in/dQFMHWZR
