<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patronus</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-width: 320px;
        background: #f5efe4;
        color: #1f2937;
      }
      main {
        padding: 16px;
      }
      .card {
        background: #fffdf7;
        border: 1px solid #decfb2;
        border-radius: 14px;
        padding: 14px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a6f3f;
        margin-bottom: 8px;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .muted {
        color: #5b6470;
        font-size: 13px;
        line-height: 1.5;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        margin: 14px 0 0;
        font-size: 12px;
      }
      dt {
        color: #7b8794;
      }
      dd {
        margin: 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="eyebrow">Phase 1</div>
        <h1 class="title">Patronus Job Copilot</h1>
        <p class="muted" id="status">Reading the current tab...</p>
        <dl id="details"></dl>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
